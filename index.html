<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy 18th Birthday Thunnu</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Great+Vibes&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
overflow-x:hidden;
background:linear-gradient(-45deg,#ff9a9e,#fad0c4,#fbc2eb,#a18cd1);
background-size:400% 400%;
animation:bg 12s ease infinite;
text-align:center;
min-height:100vh;
color:white;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.container{
padding:20px;
position:relative;
z-index:10;
}

h1{
font-family:'Great Vibes',cursive;
font-size:4rem;
margin-top:20px;
text-shadow:0 0 20px white;
animation:glow 2s infinite alternate;
}

@keyframes glow{
from{transform:scale(1);}
to{transform:scale(1.05);}
}

.subtitle{
font-size:1.3rem;
margin-bottom:20px;
}

.slideshow{
width:350px;
height:450px;
margin:auto;
position:relative;
overflow:hidden;
border-radius:25px;
box-shadow:0 0 30px rgba(255,255,255,.6);
}

.slideshow img{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
opacity:0;
animation:slide 16s infinite;
}

.slideshow img:nth-child(1){animation-delay:0s;}
.slideshow img:nth-child(2){animation-delay:4s;}
.slideshow img:nth-child(3){animation-delay:8s;}
.slideshow img:nth-child(4){animation-delay:12s;}

@keyframes slide{
0%{opacity:0;}
10%{opacity:1;}
25%{opacity:1;}
35%{opacity:0;}
100%{opacity:0;}
}

/* CAKE */

.cake{
margin:30px auto;
position:relative;
width:180px;
height:160px;
}

.layer1,.layer2,.layer3{
position:absolute;
left:50%;
transform:translateX(-50%);
border-radius:10px;
}

.layer1{
width:160px;
height:50px;
bottom:0;
background:#ff85a2;
}

.layer2{
width:130px;
height:45px;
bottom:50px;
background:#ffb3c6;
}

.layer3{
width:100px;
height:40px;
bottom:95px;
background:#ffd6e0;
}

.candle{
width:10px;
height:40px;
background:white;
position:absolute;
left:50%;
transform:translateX(-50%);
bottom:135px;
}

.flame{
width:20px;
height:20px;
background:gold;
border-radius:50%;
position:absolute;
left:50%;
transform:translateX(-50%);
bottom:172px;
box-shadow:0 0 20px yellow;
animation:flicker .5s infinite alternate;
}

@keyframes flicker{
from{transform:translateX(-50%) scale(1);}
to{transform:translateX(-50%) scale(1.2);}
}

.message{
font-size:1.3rem;
margin-top:25px;
padding:15px;
}

/* MUSIC BUTTON */

.music-btn{
padding:12px 25px;
border:none;
border-radius:30px;
background:white;
color:#ff4d88;
font-size:1rem;
font-weight:bold;
cursor:pointer;
margin-top:20px;
}

/* HEARTS */

.heart{
position:fixed;
bottom:-50px;
font-size:25px;
animation:floatHeart linear infinite;
pointer-events:none;
}

@keyframes floatHeart{
0%{
transform:translateY(0);
opacity:1;
}
100%{
transform:translateY(-120vh);
opacity:0;
}
}

/* CONFETTI */

.confetti{
position:fixed;
width:10px;
height:10px;
top:-10px;
animation:fall linear infinite;
}

@keyframes fall{
to{
transform:translateY(110vh) rotate(720deg);
}
}

@media(max-width:600px){

h1{
font-size:2.8rem;
}

.slideshow{
width:90%;
height:400px;
}

}

</style>
</head>

<body>

<audio id="music" autoplay loop>
<source src="birthday.mp3.mp3" type="audio/mpeg">
</audio>

<div class="container">

<h1>💖 Happy 18th Birthday Thunnu 💖</h1>

<p class="subtitle">
✨ Welcome to your special day ✨
</p>

<div class="slideshow">
<img src="pic1.jpg.jpeg">
<img src="pic2.jpg.jpeg">
<img src="pic3.jpg.jpeg">
<img src="pic4.jpg.jpeg">
</div>

<div class="cake">
<div class="flame"></div>
<div class="candle"></div>
<div class="layer3"></div>
<div class="layer2"></div>
<div class="layer1"></div>
</div>

<div class="message">
🎂 May your 18th year be filled with happiness,
love, laughter, success and unforgettable memories. 💖
</div>

<button class="music-btn" onclick="toggleMusic()">
🎵 Play / Pause Music
</button>

</div>

<script>

const music=document.getElementById("music");

function toggleMusic(){
if(music.paused){
music.play();
}
else{
music.pause();
}
}

/* HEARTS */

function createHeart(){

let heart=document.createElement("div");
heart.classList.add("heart");
heart.innerHTML="💖";

heart.style.left=Math.random()*100+"vw";
heart.style.animationDuration=(Math.random()*4+4)+"s";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},8000);

}

setInterval(createHeart,400);

/* CONFETTI */

const colors=[
"#ff4d6d",
"#ffd60a",
"#00f5d4",
"#ffffff",
"#ff99c8",
"#c77dff"
];

function createConfetti(){

let conf=document.createElement("div");
conf.classList.add("confetti");

conf.style.left=Math.random()*100+"vw";
conf.style.background=
colors[Math.floor(Math.random()*colors.length)];

conf.style.animationDuration=
(Math.random()*3+3)+"s";

document.body.appendChild(conf);

setTimeout(()=>{
conf.remove();
},7000);

}

setInterval(createConfetti,120);

</script>

</body>
</html>
