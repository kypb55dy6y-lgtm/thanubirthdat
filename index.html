<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Thunnuu Sreeee</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
body{margin:0;font-family:Segoe UI,sans-serif;text-align:center;overflow-x:hidden;background:linear-gradient(-45deg,#ff9a9e,#fad0c4,#fbc2eb,#a18cd1);background-size:400% 400%;animation:bg 12s ease infinite;color:white}
@keyframes bg{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
.popup,.countdown{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:9999}
.box{background:white;color:black;padding:30px;border-radius:20px;max-width:500px;width:90%}
button{padding:12px 24px;border:none;border-radius:10px;background:#ff4081;color:white;font-size:18px;cursor:pointer}
#cake{font-size:100px;margin:20px}
#balloons{display:none;font-size:55px}
.float{display:inline-block;animation:f 2s infinite}
@keyframes f{50%{transform:translateY(-25px)}}
#slideshow,#memory,#message{display:none}
.slide img{width:85%;max-width:700px;border-radius:20px;box-shadow:0 10px 25px rgba(0,0,0,.3)}
.navbtn{margin:10px}
.heart,.sparkle{position:fixed;pointer-events:none;animation:fall 5s linear forwards}
@keyframes fall{from{transform:translateY(-100px)}to{transform:translateY(110vh)}}
.card{background:rgba(255,255,255,.15);backdrop-filter:blur(10px);padding:20px;border-radius:20px;width:90%;max-width:800px;margin:20px auto}
</style>
</head>
<body>

<audio id="birthdayMusic" loop>
<source src="birthday.mp3.mp3" type="audio/mpeg">
</audio>

<div class="popup" id="popup">
<div class="box">
<h1>🎉 Happiest Birthday Thunnuu Sreeee 🎉</h1>
<p>A special surprise for you ❤️</p>
<button onclick="begin()">Start Surprise</button>
</div>
</div>

<div class="countdown" id="countdown" style="display:none;"><h1 id="countText" style="font-size:80px">3</h1></div>

<h1>🎂 Happy Birthday Thunnuu Sreeee 🎂</h1>
<div id="cake">🎂🕯️🕯️🕯️</div>
<button onclick="blowCandles()">Blow The Candles</button>

<div id="balloons">
<span class="float">🎈</span><span class="float">🎈</span><span class="float">🎈</span><span class="float">🎈</span>
</div>

<div id="slideshow">
<div class="slide"><img src="pic1.jpg.jpeg"><p>Memory 1 💖</p></div>
<div class="slide"><img src="pic2.jpg.jpeg"><p>Memory 2 ✨</p></div>
<div class="slide"><img src="pic3.jpg.jpeg"><p>Memory 3 🌸</p></div>
<div class="slide"><img src="pic4.jpg.jpeg"><p>Memory 4 🎉</p></div>
<button class="navbtn" onclick="prevSlide()">⬅ Previous</button>
<button class="navbtn" onclick="nextSlide()">Next ➡</button>
</div>

<div id="memory" class="card">
<h2>📸 Memory Lane</h2>
<p>Every photo holds a beautiful memory and many more are yet to come. ❤️</p>
</div>

<div id="message" class="card">
<h2 id="typed"></h2>
</div>

<script>
let current=0;
const msg="💖 Happiiieee 18eeeeennnn Thunnuuuuuu 💖  Thanqqq for always being there for me ✨ Wishing you lots of happiness, laughter and beautiful memories 🎂🎉 Once again... Happy Buddaayyy Thuunnnuuu Sreeeeee ❤️✨";

function begin(){
document.getElementById('popup').style.display='none';
document.getElementById('countdown').style.display='flex';
let n=3;
const t=document.getElementById('countText');
const i=setInterval(()=>{
n--;
if(n>0)t.textContent=n;
else if(n===0)t.textContent='Surprise!';
else{
clearInterval(i);
document.getElementById('countdown').style.display='none';
document.getElementById('birthdayMusic').play().catch(()=>{});
hearts(); sparkles();
}
},1000);
}

function blowCandles(){
document.getElementById('cake').innerHTML='🎂';
document.getElementById('balloons').style.display='block';
confetti({particleCount:250,spread:180});
setTimeout(()=>{
document.getElementById('slideshow').style.display='block';
showSlide(0);
},3000);
setTimeout(finale,18000);
}

function showSlide(n){
let s=document.querySelectorAll('.slide');
s.forEach(x=>x.style.display='none');
current=(n+s.length)%s.length;
s[current].style.display='block';
}
function nextSlide(){showSlide(current+1);}
function prevSlide(){showSlide(current-1);}

function finale(){
document.getElementById('memory').style.display='block';
document.getElementById('message').style.display='block';
typeMessage();
setInterval(()=>{
confetti({particleCount:100,spread:120,origin:{x:Math.random(),y:Math.random()*0.6}});
},1000);
}

function typeMessage(){
let i=0;
const el=document.getElementById('typed');
const timer=setInterval(()=>{
el.textContent+=msg.charAt(i);
i++;
if(i>=msg.length) clearInterval(timer);
},40);
}

function hearts(){
setInterval(()=>{
let d=document.createElement('div');
d.className='heart'; d.innerHTML='❤️';
d.style.left=Math.random()*100+'vw';
document.body.appendChild(d);
setTimeout(()=>d.remove(),5000);
},500);
}
function sparkles(){
setInterval(()=>{
let d=document.createElement('div');
d.className='sparkle'; d.innerHTML='✨';
d.style.left=Math.random()*100+'vw';
document.body.appendChild(d);
setTimeout(()=>d.remove(),5000);
},400);
}
</script>
</body>
</html>
